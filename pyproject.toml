[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alain-alsahira"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Arabic runtime EDR advisor."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
alain-alsahira = "alain_alsahira.cli:main"

[tool.setuptools]
packages = ["alain_alsahira"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
